# Local model bindings.
#
# Model identifiers live here rather than in Python because no model identifier
# may appear outside the providers package — constitution principle 5, asserted
# by a source scan in the test suite.
#
# Port allocation is deliberate and non-overlapping:
#   8080  Second Shift API
#   8200  local reasoner
#   8201  local embedder
#   8000  left free — the vLLM default, and what an ad-hoc server will grab
#   11434 ollama
# Sharing 8000 would mean the probe had to distinguish two different services on
# one socket, which is a guarantee resting on start order.
#
# `local_reasoner_model` is the identifier the local server reports for itself.
# For vLLM that is whatever `--served-model-name` was set to at launch, which is
# why this is configuration and not a constant: the probe cannot know it
# otherwise, and an endpoint serving something else must be refused by name.

# Sampling is configuration, not code. `reasoner_temperature` is deliberately
# non-zero: `evals` reports a spread alongside a mean so a week-1-to-week-8
# difference can be told from sampling noise, and a deterministic reasoner would
# report a spread of zero that measures the sampler rather than the system.
#
# `reasoner_timeout_s` is generous because it bounds one completion, not a run.
# Spike B measured 5.3s median at 3 concurrent; a long overnight stage is the
# case this has to survive, and a timeout that fires early is recorded as a
# model failure and loses real work.

[local]
reasoner_model = "nemotron-3.5-lightning"
reasoner_host = "127.0.0.1"
reasoner_port = 8200
# 16000, from the model card's own examples. The first real night ran at 4096
# and the reasoner spent the whole budget thinking: three of six turns stopped
# inside their deliberation with no answer written.
reasoner_max_tokens = 16000
reasoner_temperature = 0.7
reasoner_timeout_s = 300

# The embedder is its own server on its own port rather than a second role for
# the reasoner's. Sharing 8200 would make the probe unable to say which service
# is down when one of them is, and the two have different lifecycles: the
# reasoner is restarted to change sampling, the embedder almost never.
#
# `dimensions` is not a request parameter — it is what this model returns, and
# it is recorded here so the index can allocate its array before the first
# response arrives, and so a server quietly swapped for a different model is a
# loud shape mismatch rather than a silently wrong index.
#
# `embedder_timeout_s` is short next to the reasoner's 300: embedding is a
# single forward pass over a few kilobytes with no generation loop, so a slow
# response means something is wrong rather than something is thinking.

[embedder]
embedder_model = "nvidia/llama-nemotron-embed-vl-1b-v2"
embedder_host = "127.0.0.1"
embedder_port = 8201
embedder_dimensions = 2048
embedder_timeout_s = 30

# How the week-1 to week-8 comparison is produced, and what it is pinned to.
#
# `judge_version` is recorded in `eval_runs.judge_model_version` and never
# floats. It is not read from the inference server: vLLM reports whatever
# `--served-model-name` was set to at launch, so a version taken from the
# endpoint changes when the endpoint is restarted against another checkpoint,
# and a past run's claim about itself would then depend on the present.
#
# `generating_role` is which agent produces the answers being graded. Eval
# answers go through the product's own agent path rather than through a
# composition written for evaluation, because an improvement in a harness is not
# an improvement in the product. `architect` because the prompt set is
# idea-interrogation shaped and *interrogation* is the rubric's first dimension.
#
# A prompt replaced between the two runs is refused by the curve rather than
# reported: the scores would move for a reason that is not memory. See
# `docs/decisions/0015`.

[evals]
judge_version = "nemotron-3.5-lightning-nvfp4-2026-08"
generating_role = "architect"

# The cloud reasoner: Token Factory, for the turns ADR 0004 assigns to the
# cloud — research synthesis, architect, critic — under `cloud-assisted` only.
#
# `reasoner_model` is the identifier `/v1/models` serves, read from the API on
# 17 Oct, not the console's display name. They differ for every Nemotron model
# (`nvidia/nemotron-3-super-120b-a12b` against "Nvidia-Nemotron-3-Super-120B-
# A12B"), and a request naming the display name is refused. Super rather than
# 3.5 Super VL, which is multimodal and priced the same: nothing here sends an
# image, and `docs/MODELS.md` binds Super.
#
# The standard endpoint, never Batch: `POST /v1/batches` answered 403 on 2 Sep.
#
# The credential is not here and never will be. It is `NEBIUS_API_KEY`, read
# from the environment at the call.

[cloud]
reasoner_base_url = "https://api.tokenfactory.nebius.com/v1"
reasoner_model = "nvidia/nemotron-3-super-120b-a12b"
reasoner_max_tokens = 16000
reasoner_temperature = 0.7
reasoner_timeout_s = 300
