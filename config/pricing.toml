# --- Nemotron 3 Ultra — frontier turns ----------------------------------------
# Was "and the pinned eval judge" until 16 Oct. ADR 0015 moved the judge off
# Token Factory on 10 Oct: an eval answer is generated from brain topic files,
# which carry local-only, so a cloud judge was never permissible. The rate stays
# because frontier turns still bind here; a rate is never deleted, only
# superseded by a later effective_from.

[[rate]]
provider = "token-factory"
model = "Nemotron-3-Ultra-550B-a55B"
effective_from = "2026-06-01"
prompt_usd_per_mtok = 1.00
completion_usd_per_mtok = 3.00

[[rate]]
provider = "token-factory"
model = "Nemotron-3-Ultra-550B-a55B-Batch"
effective_from = "2026-06-01"
prompt_usd_per_mtok = 0.50
completion_usd_per_mtok = 1.50

# --- 17 Oct: the identifiers the API serves ------------------------------------
# Appended rather than edited in place, per the rule above. The entries before
# this line are keyed by console display names and will never match a recorded
# call; they stay so the file's history reads as it happened. No token-factory
# call had been recorded anywhere when this was written.
#
# Read from `GET /v1/models` on 17 Oct, which reports each model's own pricing
# per token: Lightning 0.00000006 / 0.00000024, Super 0.0000003 / 0.0000009,
# Ultra 0.000001 / 0.000003 — the same rates the console showed on 27 Aug. The
# effective dates are the console's, carried over. No `-Batch` identifier is
# served at all, so Batch has no entry here.

[[rate]]
provider = "token-factory"
model = "nvidia/Nemotron-3_5-Lightning"
effective_from = "2026-08-01"
prompt_usd_per_mtok = 0.06
completion_usd_per_mtok = 0.24

