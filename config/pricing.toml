# Per-token rates. Git-tracked so a historical cost curve is reproducible from
# the repository alone: costs already recorded never change, and the rate that
# produced any past cost is recoverable by reading the entry in effect then.
#
# A missing rate is a loud failure, never a silent zero. The cost-per-accepted-
# artifact curve is a measurement, and understating it is worse than stopping.
#
# Refreshed weekly. Never edit a past entry to correct a rate — append a new
# one with a later effective_from, so history stays reproducible.
#
# Rates are USD per million tokens. effective_from is an ISO-8601 UTC date.

[[rate]]
provider = "local-vllm"
model = "*"
effective_from = "2026-01-01"
prompt_usd_per_mtok = 0.0
completion_usd_per_mtok = 0.0
note = "Local inference on owned hardware. Zero marginal token cost by definition; this is what makes a local-only idea visibly free."

# Lightning and Ultra are DELIBERATELY ABSENT.
#
# Only blended figures are published for them — Lightning ~$0.08/Mtok and Ultra
# ~$1.20/Mtok, each computed over a 7:2:1 cache/input/output ratio. A blended
# number cannot be split back into input and output rates without knowing the
# cache-hit price, and a guessed split would produce a cost curve that is wrong
# in a way nothing surfaces.
#
# An absent rate raises MissingRate and fails the call loudly. That is the
# correct behaviour: the cost curve is a scored measurement, and a plausible
# wrong number is worse than a stopped run.
#
# To add them, read the input and output prices from the Token Factory console
# (tokenfactory.nebius.com -> organization -> prices) and append entries here.

[[rate]]
provider = "token-factory"
model = "nemotron-3-super-120b-a12b"
effective_from = "2026-08-27"
prompt_usd_per_mtok = 0.30
completion_usd_per_mtok = 0.90
note = "Source: Artificial Analysis provider table, 2026-08-27 — a third-party aggregator, not Nebius directly. Confirm against the Token Factory console and supersede with a new effective_from entry if it differs. Do not edit this entry; history must stay reproducible."
