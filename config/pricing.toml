# Per-token rates, USD per million tokens. effective_from is an ISO-8601 UTC date.
#
# Git-tracked so a historical cost curve is reproducible from the repository
# alone: costs already recorded never change, and the rate that produced any
# past cost is recoverable by reading the entry in effect at that timestamp.
#
# A missing rate is a loud failure, never a silent zero. The cost-per-accepted-
# artifact curve is a scored measurement, and understating it is worse than
# stopping.
#
# `model` MUST be the identifier the API serves, as `/v1/models` lists it,
# including case and the `nvidia/` prefix. This said "the exact Token Factory
# console identifier" until 17 Oct, and the console shows a display name the API
# does not accept: every Token Factory entry below the line marked 17 Oct was
# keyed by one, so a real call would have raised MissingRate on its first
# completion. A mismatch here does not warn; it raises MissingRate mid-run.
#
# Never edit a past entry to correct a rate. Append a new one with a later
# effective_from so history stays reproducible. (This file was rewritten once,
# on 2026-08-27, while no model_calls existed anywhere — there was no history to
# preserve. That exemption does not apply again.)
#
# Rates read from the Token Factory console, region eu-north1, on 2026-08-27.
# The effective_from dates are the console's own, not the date they were read.

[[rate]]
provider = "local-vllm"
model = "*"
effective_from = "2026-01-01"
prompt_usd_per_mtok = 0.0
completion_usd_per_mtok = 0.0
note = "Local inference on owned hardware. Zero marginal token cost by definition; this is what makes a local-only idea visibly free."

