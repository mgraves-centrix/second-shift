[project]
name = "secondshift"
version = "0.1.0"
description = "Second Shift orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    # Retrieval only. ADR 0002 chose brute-force cosine over an in-memory array
    # rather than a vector database, and this is the array. It is the one
    # numeric dependency; nothing else in the orchestrator imports it.
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.4", "httpx2>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["secondshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
